name: Build and deploy to Azure

# Trigger: run this whole pipeline automatically on every push to main.
# This is the "push to GitHub -> auto deploy" behavior you asked for.
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: get your code onto GitHub's temporary build machine.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: authenticate to Azure Container Registry, so the next
      # step is allowed to push an image there.
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Step 3: the exact same `docker build` you've been running by
      # hand this whole lesson - just triggered by GitHub instead of you.
      # Tagged with the commit SHA, not "latest", so every deploy is
      # traceable back to the exact commit that produced it.
      - name: Build and push image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/amango-app:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/amango-app:${{ github.sha }}

      # Step 4: tell Azure App Service to start running the image we
      # just pushed. This is the actual "deploy" step.
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/amango-app:${{ github.sha }}
